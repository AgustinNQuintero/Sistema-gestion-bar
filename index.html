<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brasa — Gestión del Bar</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#20242b;--muted:#737b87;--line:#e5e8ed;--dark:#20252d;--accent:#d97735;--green:#23865b;--red:#c44545;--blue:#3977c3;--amber:#b7791f}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;background:var(--dark);color:white;font-weight:650}button.secondary{background:#eef0f3;color:#343a43}button.accent{background:var(--accent)}button.good{background:var(--green)}button.danger{background:#fff0f0;color:var(--red)}button:disabled{opacity:.4;cursor:not-allowed}
header{background:var(--dark);color:white;padding:15px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:3}
.brand{display:flex;align-items:center;gap:11px}.logo{width:38px;height:38px;border-radius:12px;background:var(--accent);display:grid;place-items:center;font-size:21px}.brand strong{font-size:18px;letter-spacing:.2px}.brand small{display:block;color:#c3c8d0;font-size:11px}
.topright{display:flex;align-items:center;gap:10px;color:#d8dce2;font-size:12px}.dot{width:8px;height:8px;background:#50c58b;border-radius:50%;display:inline-block;margin-right:5px}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 68px)}nav{padding:20px 12px;border-right:1px solid var(--line);background:#fbfbfc}nav .label{font-size:10px;color:#9aa0a9;font-weight:800;letter-spacing:1.3px;padding:12px 12px 7px}nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;color:#535b66;font-weight:600;margin:3px 0;padding:11px 12px}nav button.active{background:#fff0e6;color:#9b4b19;box-shadow:inset 3px 0 var(--accent)}nav button span{width:20px;text-align:center;font-size:16px}
main{padding:26px;min-width:0;max-width:1500px;width:100%;margin:0 auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:22px}.pagehead h1{margin:0 0 5px;font-size:25px;letter-spacing:-.6px}.pagehead p{margin:0;color:var(--muted)}.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:22px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px}.stat .st-label{color:var(--muted);font-size:12px}.stat .num{font-size:26px;font-weight:800;margin-top:5px;letter-spacing:-.7px}.stat .hint{font-size:11px;color:var(--muted);margin-top:3px}.section-title{font-size:15px;font-weight:800;margin:0 0 13px}.table-grid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px}.tabletile{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;text-align:left;color:var(--ink);min-height:130px;position:relative;transition:.15s}.tabletile:hover{border-color:#c8a68f;transform:translateY(-1px)}.tabletile.occupied{border-top:4px solid var(--accent)}.tabletile.ready{border-top:4px solid var(--green)}.tabletile.bill{border-top:4px solid var(--blue)}.tabletop{display:flex;justify-content:space-between;align-items:center}.tablenum{font-size:21px;font-weight:850}.capacity{font-size:11px;color:var(--muted)}.tableamount{font-size:17px;font-weight:800;margin-top:17px}.tablemeta{font-size:11px;color:var(--muted);margin-top:3px}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:30px;padding:4px 8px;font-size:10px;font-weight:800;background:#f0f2f5;color:#5c6470}.pill.green{background:#e7f7ee;color:#23774e}.pill.orange{background:#fff0e5;color:#a5531c}.pill.blue{background:#eaf2ff;color:#2f64a4}.pill.red{background:#fff0f0;color:#b33c3c}
.two-col{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);gap:16px}.product-cats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.product-cats button{background:#f0f2f5;color:#626a75;padding:8px 11px}.product-cats button.active{background:var(--dark);color:#fff}.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.product{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;color:var(--ink);text-align:left;min-height:108px}.product:hover{border-color:var(--accent)}.product .emoji{font-size:22px;margin-bottom:7px}.product .pname{font-weight:750}.product .pcat{font-size:11px;color:var(--muted)}.product .price{font-weight:850;margin-top:7px;color:#9b4b19}.cart-line{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.cart-line:last-child{border-bottom:0}.cart-name{font-weight:750}.cart-sub{font-size:11px;color:var(--muted);margin-top:2px}.qty{display:flex;align-items:center;gap:8px}.qty button{padding:3px 8px;background:#eef0f3;color:#343a43}.totalrow{display:flex;justify-content:space-between;padding:14px 0;font-weight:850;font-size:18px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:12px;color:#626a75;font-weight:700}.field input,.field select,.field textarea{border:1px solid #dce0e6;border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink);width:100%;min-width:0}.field textarea{resize:vertical;min-height:65px}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.ticket-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.ticket{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.ticket-head{padding:13px 14px;background:#fafafa;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.ticket-head strong{font-size:14px}.ticket-body{padding:14px}.ticket-item{padding:9px 0;border-bottom:1px dashed var(--line)}.ticket-item:last-child{border-bottom:0}.ticket-item strong{display:block}.ticket-item small{color:var(--muted)}.ticket-foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:7px;flex-wrap:wrap}.ticket-foot button{flex:1;padding:8px 9px;font-size:12px}.empty{padding:35px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #d7dce3;border-radius:13px}.empty .big{font-size:30px;margin-bottom:7px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{padding:9px;border:1px solid var(--line);border-radius:9px;background:white}.data-table{width:100%;border-collapse:collapse;background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.data-table th,.data-table td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:12px}.data-table th{background:#f8f9fa;color:#69717c;font-size:10px;text-transform:uppercase;letter-spacing:.7px}.data-table tr:last-child td{border-bottom:0}.data-table td strong{font-size:13px}.small-btn{padding:6px 9px;font-size:11px}.notice{border-radius:10px;padding:12px 14px;background:#fff6e8;color:#86551a;font-size:12px;margin-bottom:16px;border:1px solid #f3e1c2}.success-note{background:#eaf8f0;color:#26754d;border-color:#d2efde}.split{display:flex;justify-content:space-between;gap:15px;align-items:center}.muted{color:var(--muted)}.subheading{font-weight:800;margin:20px 0 10px}.hide{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:#20252d;color:#fff;padding:13px 16px;border-radius:11px;box-shadow:0 10px 35px #0002;z-index:8;max-width:320px}.modalback{position:fixed;inset:0;background:#11182788;z-index:10;display:grid;place-items:center;padding:18px}.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px}.modal h2{margin:0 0 15px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.offline{color:#ffcf89}.footnote{font-size:11px;color:var(--muted);margin-top:18px}
@media(max-width:1000px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:7px;gap:3px}nav .label{display:none}nav button{width:auto;white-space:nowrap;margin:0;padding:10px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.table-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.ticket-list{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}}
@media(max-width:650px){header{padding:12px 14px}.topright .status-text{display:none}main{padding:17px 13px}.pagehead{flex-direction:column}.pagehead h1{font-size:22px}.stats{gap:8px}.stat{padding:12px}.stat .num{font-size:22px}.table-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tabletile{padding:11px;min-height:118px}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ticket-list{grid-template-columns:1fr}.row{flex-direction:column;gap:0}.data-table th,.data-table td{padding:9px 8px}.hide-mobile{display:none}.topright{font-size:10px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<header>
 <div class="brand"><div class="logo">♨</div><div><strong>brasa<span style="color:#f0a16c">.</span></strong><small>GESTIÓN INTEGRAL DEL BAR</small></div></div>
 <div class="topright"><span><i class="dot"></i><span class="status-text" id="syncStatus">Modo local activo</span></span><span id="clock"></span></div>
</header>
<div class="layout">
<nav>
 <div class="label">OPERACIÓN</div>
 <button class="active" data-page="salon"><span>▦</span>Salón y mesas</button>
 <button data-page="waiter"><span>＋</span>Tomar pedido</button>
 <button data-page="kitchen"><span>♨</span>Cocina <b id="kCount"></b></button>
 <button data-page="bar"><span>◉</span>Barra <b id="bCount"></b></button>
 <button data-page="cashier"><span>＄</span>Caja</button>
 <div class="label">ADMINISTRACIÓN</div>
 <button data-page="inventory"><span>▤</span>Inventario</button>
 <button data-page="products"><span>☷</span>Productos y recetas</button>
 <button data-page="reports"><span>▥</span>Resumen del día</button>
</nav>
<main id="main"></main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const KEY='brasa_bar_demo_v1';
const initial={
 tables:Array.from({length:12},(_,i)=>({id:i+1,capacity:i<4?2:4})),
 products:[
 
 ],
 stock:[
],
 orders:[],nextOrder:1,activeTable:null,category:'Todos',cart:{},cartNotes:'',paymentMethod:'Efectivo',cashOpen:true,sessionSales:[],sessionStart:new Date().toISOString()
};
let state;
try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){state=JSON.parse(JSON.stringify(initial))}
let page='salon', selectedStation='kitchen', searchTerm='';
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderBadges()}
function money(n){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function activeOrders(){return state.orders.filter(o=>o.status!=='paid'&&o.status!=='cancelled')}
function tableOrders(id){return activeOrders().filter(o=>o.tableId===id)}
function tableTotal(id){return tableOrders(id).reduce((s,o)=>s+o.items.reduce((a,i)=>a+i.price*i.qty,0),0)}
function statusForTable(id){let os=tableOrders(id);if(!os.length)return 'Libre';if(os.some(o=>o.status==='bill'))return 'Por cobrar';if(os.every(o=>o.items.every(i=>i.kitchenStatus==='ready'&&i.barStatus==='ready')))return 'Listo';return 'Ocupada'}
function totalOrder(o){return o.items.reduce((s,i)=>s+i.qty*i.price,0)}
function fmtTime(iso){return new Date(iso).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}
function renderBadges(){let os=activeOrders();let k=os.reduce((n,o)=>n+o.items.filter(i=>i.station==='kitchen'&&i.kitchenStatus!=='ready').length,0);let b=os.reduce((n,o)=>n+o.items.filter(i=>i.station==='bar'&&i.barStatus!=='ready').length,0);document.getElementById('kCount').textContent=k||'';document.getElementById('bCount').textContent=b||''}
function go(p){page=p;document.querySelectorAll('nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('nav button[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function head(title,desc,actions=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div><div class="head-actions">${actions}</div></div>`}
function stat(label,num,hint,icon){return `<div class="stat"><div class="split"><span class="st-label">${label}</span><span>${icon||''}</span></div><div class="num">${num}</div><div class="hint">${hint||''}</div></div>`}
function render(){renderBadges();let root=document.getElementById('main');if(page==='salon')root.innerHTML=renderSalon();if(page==='waiter')root.innerHTML=renderWaiter();if(page==='kitchen')root.innerHTML=renderStation('kitchen');if(page==='bar')root.innerHTML=renderStation('bar');if(page==='cashier')root.innerHTML=renderCashier();if(page==='inventory')root.innerHTML=renderInventory();if(page==='products')root.innerHTML=renderProducts();if(page==='reports')root.innerHTML=renderReports();bindPage()}
function renderSalon(){
 let os=activeOrders(), occupied=state.tables.filter(t=>tableOrders(t.id).length).length, pending=os.reduce((s,o)=>s+o.items.filter(i=>i.kitchenStatus!=='ready'||i.barStatus!=='ready').length,0), revenue=state.sessionSales.reduce((s,x)=>s+x.total,0);
 return head('Salón y mesas','Vista en vivo de las mesas y sus cuentas.',`<button class="accent" onclick="newOrder()">＋ Nuevo pedido</button>`)
 +`<div class="stats">${stat('Mesas ocupadas',occupied+' / '+state.tables.length,'Mesas con una cuenta abierta','▦')}${stat('Pedidos abiertos',os.length,'Incluye todas las mesas','☷')}${stat('Productos pendientes',pending,'Cocina y barra','◷')}${stat('Ventas registradas',money(revenue),'Desde el inicio de esta sesión','＄')}</div>
 <div class="split" style="margin-bottom:13px"><h2 class="section-title" style="margin:0">Mapa del salón</h2><div class="toolbar" style="margin:0"><span class="pill green">Libre</span><span class="pill orange">Ocupada</span><span class="pill blue">Por cobrar</span></div></div>
 <div class="table-grid">${state.tables.map(t=>{let s=statusForTable(t.id),os=tableOrders(t.id);return `<button class="tabletile ${s==='Libre'?'':s==='Listo'?'ready':s==='Por cobrar'?'bill':'occupied'}" onclick="openTable(${t.id})"><div class="tabletop"><span class="tablenum">Mesa ${t.id}</span><span class="capacity">♙ ${t.capacity}</span></div><div style="margin-top:8px"><span class="pill ${s==='Libre'?'green':s==='Por cobrar'?'blue':'orange'}">${s}</span></div><div class="tableamount">${s==='Libre'?'Disponible':money(tableTotal(t.id))}</div><div class="tablemeta">${os.length?os.length+' pedido(s) · '+os.map(o=>'#'+o.id).join(', '):'Tocá para abrir la mesa'}</div></button>`}).join('')}</div>
 <div class="footnote">Consejo: tocá una mesa para ver su cuenta, agregar productos o solicitar el cobro.</div>`;
}
function renderWaiter(){
 let cats=['Todos',...new Set(state.products.map(p=>p.category))];let prods=state.products.filter(p=>(state.category==='Todos'||p.category===state.category)&&(p.name.toLowerCase().includes(searchTerm.toLowerCase())));
 let cart=Object.values(state.cart),total=cart.reduce((s,x)=>s+x.price*x.qty,0);
 return head('Tomar pedido','Seleccioná una mesa, agregá productos y enviá cada ítem a su sector.',`<button class="secondary" onclick="clearCart()">Limpiar pedido</button>`)
 +`<div class="notice">Los productos se enrutan automáticamente a <b>cocina</b> o <b>barra</b> según su configuración. En esta demo los datos se guardan en este navegador.</div>
 <div class="two-col"><section class="card"><div class="row"><div class="field"><label>Mesa</label><select id="orderTable"><option value="">Elegir mesa...</option>${state.tables.map(t=>`<option value="${t.id}" ${String(state.activeTable)===String(t.id)?'selected':''}>Mesa ${t.id} (${statusForTable(t.id)})</option>`).join('')}</select></div><div class="field"><label>Buscar producto</label><input id="productSearch" placeholder="Ej. hamburguesa, cerveza..." value="${esc(searchTerm)}"></div></div>
 <div class="product-cats">${cats.map(c=>`<button class="${state.category===c?'active':''}" onclick="setCategory('${esc(c)}')">${esc(c)}</button>`).join('')}</div>
 <div class="product-grid">${prods.map(p=>`<button class="product" onclick="addCart('${p.id}')"><div class="emoji">${p.emoji}</div><div class="pname">${esc(p.name)}</div><div class="pcat">${p.station==='kitchen'?'♨ Cocina':'◉ Barra'}</div><div class="price">${money(p.price)}</div></button>`).join('')||'<div class="empty">No se encontraron productos.</div>'}</div></section>
 <aside class="card"><div class="split"><h2 class="section-title" style="margin:0">Pedido actual</h2><span class="pill">${cart.reduce((s,x)=>s+x.qty,0)} ítems</span></div><div style="margin-top:8px">${cart.length?cart.map(x=>`<div class="cart-line"><div><div class="cart-name">${esc(x.name)}</div><div class="cart-sub">${money(x.price)} · ${x.station==='kitchen'?'Cocina':'Barra'}</div></div><div class="qty"><button onclick="changeQty('${x.id}',-1)">−</button><b>${x.qty}</b><button onclick="changeQty('${x.id}',1)">+</button></div></div>`).join(''):'<div class="empty" style="padding:22px 10px">Todavía no agregaste productos.</div>'}</div>
 <div class="field" style="margin-top:12px"><label>Observaciones del pedido (opcional)</label><textarea id="cartNotes" placeholder="Ej. sale primero la bebida, alergias...">${esc(state.cartNotes)}</textarea></div>
 <div class="totalrow"><span>Total</span><span>${money(total)}</span></div><button class="accent" style="width:100%" onclick="sendOrder()" ${!cart.length?'disabled':''}>Enviar pedido a cocina y barra →</button><div class="footnote">Al enviarlo se crea un pedido. Los pedidos nuevos se agregan como una nueva comanda de la mesa.</div></aside></div>`;
}
function renderStation(station){
 let os=activeOrders().map(o=>({...o,items:o.items.filter(i=>i.station===station&&((station==='kitchen'?i.kitchenStatus:i.barStatus)!=='ready'))})).filter(o=>o.items.length);
 let title=station==='kitchen'?'Pantalla de cocina':'Pantalla de barra',desc=station==='kitchen'?'Preparación de comidas y platos.':'Bebidas, tragos y cafetería.';
 return head(title,desc,`<button class="secondary" onclick="render()">↻ Actualizar</button>`)
 +`<div class="notice">${os.length?'Hay '+os.length+' comandas con productos pendientes. Marcá cada producto como listo cuando esté terminado.':'No hay productos pendientes en este sector.'}</div>`
 +(os.length?`<div class="ticket-list">${os.map(o=>`<article class="ticket"><div class="ticket-head"><div><strong>Mesa ${o.tableId} · Pedido #${o.id}</strong><div class="muted" style="font-size:11px;margin-top:3px">${fmtTime(o.createdAt)} · ${Math.max(0,Math.floor((Date.now()-new Date(o.createdAt).getTime())/60000))} min</div></div><span class="pill ${station==='kitchen'?'orange':'blue'}">${station==='kitchen'?'COCINA':'BARRA'}</span></div><div class="ticket-body">${o.items.map(i=>`<div class="ticket-item"><strong>${i.qty} × ${esc(i.name)}</strong>${i.notes?`<small>Nota: ${esc(i.notes)}</small>`:''}<div style="margin-top:7px"><button class="good small-btn" onclick="markReady(${o.id},'${i.id}','${station}')">✓ Marcar listo</button></div></div>`).join('')}${o.notes?`<div class="footnote">Nota general: ${esc(o.notes)}</div>`:''}</div><div class="ticket-foot"><span class="muted" style="font-size:11px">Total pedido: ${money(totalOrder(o))}</span></div></article>`).join('')}</div>`:'<div class="empty"><div class="big">✓</div><b>Todo al día</b><div>No hay productos pendientes en este sector.</div></div>');
}
function renderCashier(){
 let os=activeOrders(), totalOpen=os.reduce((s,o)=>s+totalOrder(o),0), sales=state.sessionSales;
 return head('Caja','Cuentas abiertas, cobros y cierre de mesa.',`<button class="secondary" onclick="exportData()">Exportar datos</button>`)
 +`<div class="stats">${stat('Cuentas abiertas',os.length,'Mesas pendientes','▤')}${stat('Total por cobrar',money(totalOpen),'Importe de pedidos abiertos','＄')}${stat('Ventas cobradas',money(sales.reduce((s,x)=>s+x.total,0)),'En esta sesión','✓')}${stat('Estado de caja',state.cashOpen?'Abierta':'Cerrada',state.cashOpen?'Lista para cobrar':'No admite cobros','◷')}</div>
 <div class="card"><div class="split"><h2 class="section-title">Cuentas abiertas</h2><span class="pill">${os.length} cuentas</span></div>${os.length?`<div style="overflow:auto"><table class="data-table"><thead><tr><th>Mesa / pedido</th><th>Hora</th><th>Detalle</th><th>Total</th><th>Acción</th></tr></thead><tbody>${os.map(o=>`<tr><td><strong>Mesa ${o.tableId} · #${o.id}</strong></td><td>${fmtTime(o.createdAt)}</td><td>${o.items.map(i=>i.qty+'× '+esc(i.name)).join(', ')}</td><td><strong>${money(totalOrder(o))}</strong></td><td><button class="accent small-btn" onclick="payOrder(${o.id})" ${!state.cashOpen?'disabled':''}>Cobrar</button> <button class="secondary small-btn" onclick="markBill(${o.id})">Por cobrar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay cuentas abiertas.</div>'}</div>
 <div class="card" style="margin-top:15px"><div class="split"><h2 class="section-title">Control de caja</h2><span class="pill ${state.cashOpen?'green':'red'}">${state.cashOpen?'Abierta':'Cerrada'}</span></div><p class="muted">El cierre es demostrativo y no reemplaza un sistema fiscal ni un arqueo formal.</p><button class="${state.cashOpen?'danger':'good'}" onclick="toggleCash()">${state.cashOpen?'Cerrar caja':'Abrir caja'}</button>
 <h3 class="subheading">Últimos cobros</h3>${sales.length?`<table class="data-table"><thead><tr><th>Hora</th><th>Mesa</th><th>Medio</th><th>Total</th></tr></thead><tbody>${sales.slice(-8).reverse().map(x=>`<tr><td>${fmtTime(x.paidAt)}</td><td>Mesa ${x.tableId}</td><td>${esc(x.method)}</td><td>${money(x.total)}</td></tr>`).join('')}</tbody></table>`:'<div class="muted">Todavía no hay cobros registrados.</div>'}</div>`;
}
function renderInventory(){
 let low=state.stock.filter(s=>s.qty<=s.min);
 return head('Inventario','Stock de ingredientes y productos de uso interno.',`<button class="accent" onclick="stockModal()">＋ Ajustar stock</button>`)
 +`<div class="stats">${stat('Ingredientes',state.stock.length,'Elementos inventariados','▤')}${stat('Stock bajo',low.length,'Requieren reposición',low.length?'⚠':'✓')}${stat('Productos de carta',state.products.length,'Con receta configurada','☷')}${stat('Descuento automático','Activo','Al enviar comandas en esta demo','↘')}</div>
 <div class="notice">El stock se descuenta cuando se envía una comanda. Las recetas de ejemplo son ilustrativas: revisá cantidades, unidades y mermas antes de usarlo en operaciones reales.</div>
 <div class="card"><div class="toolbar"><input id="stockSearch" placeholder="Buscar ingrediente..." value="${esc(searchTerm)}"><select id="stockFilter"><option value="all">Todos</option><option value="low">Solo stock bajo</option></select></div><div style="overflow:auto"><table class="data-table"><thead><tr><th>Ingrediente</th><th>Disponible</th><th>Mínimo</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="stockRows">${stockRows()}</tbody></table></div></div>`;
}
function stockRows(){return state.stock.filter(s=>s.name.toLowerCase().includes(searchTerm.toLowerCase())&&(document.getElementById('stockFilter')?.value!=='low'||s.qty<=s.min)).map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${s.qty} ${esc(s.unit)}</td><td>${s.min} ${esc(s.unit)}</td><td><span class="pill ${s.qty<=s.min?'red':'green'}">${s.qty<=s.min?'Reponer':'Normal'}</span></td><td><button class="secondary small-btn" onclick="adjustStock('${esc(s.name)}')">Ajustar</button></td></tr>`).join('')}
function renderProducts(){
 return head('Productos y recetas','Administrá precios, sectores de preparación y recetas.',`<button class="accent" onclick="productModal()">＋ Nuevo producto</button>`)
 +`<div class="notice">Cada producto se asigna a cocina o barra. Los ingredientes configurados en su receta se descuentan del stock al enviar el pedido.</div><div class="card"><div class="toolbar"><input id="prodSearch" placeholder="Buscar producto..." value="${esc(searchTerm)}"><select id="prodStation"><option value="all">Todos los sectores</option><option value="kitchen">Cocina</option><option value="bar">Barra</option></select></div><div style="overflow:auto"><table class="data-table"><thead><tr><th>Producto</th><th>Categoría</th><th>Sector</th><th>Precio</th><th>Receta</th><th>Acción</th></tr></thead><tbody id="productRows">${productRows()}</tbody></table></div></div>`;
}
function productRows(){let station=document.getElementById('prodStation')?.value||'all';return state.products.filter(p=>p.name.toLowerCase().includes(searchTerm.toLowerCase())&&(station==='all'||p.station===station)).map(p=>`<tr><td><strong>${p.emoji} ${esc(p.name)}</strong></td><td>${esc(p.category)}</td><td>${p.station==='kitchen'?'Cocina':'Barra'}</td><td>${money(p.price)}</td><td>${p.ingredients.length} ingrediente(s)</td><td><button class="secondary small-btn" onclick="editProduct('${p.id}')">Editar</button></td></tr>`).join('')}
function renderReports(){
 let sales=state.sessionSales, total=sales.reduce((s,x)=>s+x.total,0), counts={};sales.forEach(x=>x.items.forEach(i=>counts[i.name]=(counts[i.name]||0)+i.qty));
 let top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
 return head('Resumen del día','Indicadores de la sesión actual del navegador.',`<button class="secondary" onclick="exportData()">Exportar reporte JSON</button>`)
 +`<div class="stats">${stat('Ventas cobradas',money(total),sales.length+' cuenta(s) cerrada(s)','＄')}${stat('Pedidos abiertos',activeOrders().length,'En proceso','☷')}${stat('Unidades vendidas',Object.values(counts).reduce((a,b)=>a+b,0),'Solo pedidos cobrados','✓')}${stat('Ticket promedio',sales.length?money(total/sales.length):money(0),'Por cuenta cobrada','↗')}</div>
 <div class="two-col"><div class="card"><h2 class="section-title">Productos más vendidos</h2>${top.length?top.map(([n,q])=>`<div class="split" style="padding:12px 0;border-bottom:1px solid var(--line)"><span>${esc(n)}</span><b>${q} u.</b></div>`).join(''):'<div class="empty">Los productos aparecerán aquí después de cobrar cuentas.</div>'}</div><div class="card"><h2 class="section-title">Estado de la operación</h2><div class="split" style="padding:10px 0"><span>Mesas totales</span><b>${state.tables.length}</b></div><div class="split" style="padding:10px 0"><span>Mesas ocupadas</span><b>${state.tables.filter(t=>tableOrders(t.id).length).length}</b></div><div class="split" style="padding:10px 0"><span>Ingredientes en stock bajo</span><b>${state.stock.filter(s=>s.qty<=s.min).length}</b></div><div class="split" style="padding:10px 0"><span>Caja</span><b>${state.cashOpen?'Abierta':'Cerrada'}</b></div><p class="footnote">Los reportes se calculan con los datos guardados en este navegador. No se comparten entre dispositivos en esta versión inicial.</p></div></div>
 <div class="card" style="margin-top:15px"><div class="split"><h2 class="section-title">Herramientas de prueba</h2><button class="danger small-btn" onclick="resetDemo()">Restablecer demo</button></div><p class="muted">Restablece mesas, productos, recetas, stock y pedidos al estado inicial de prueba. Esta acción borra los cambios locales.</p></div>`;
}
function bindPage(){
 if(document.getElementById('orderTable'))document.getElementById('orderTable').onchange=e=>{state.activeTable=e.target.value?Number(e.target.value):null;save()};
 if(document.getElementById('productSearch'))document.getElementById('productSearch').oninput=e=>{searchTerm=e.target.value;let pos=e.target.selectionStart;render();let el=document.getElementById('productSearch');el.focus();el.setSelectionRange(pos,pos)};
 if(document.getElementById('cartNotes'))document.getElementById('cartNotes').oninput=e=>state.cartNotes=e.target.value;
 if(document.getElementById('stockSearch'))document.getElementById('stockSearch').oninput=e=>{searchTerm=e.target.value;document.getElementById('stockRows').innerHTML=stockRows()};
 if(document.getElementById('stockFilter'))document.getElementById('stockFilter').onchange=()=>document.getElementById('stockRows').innerHTML=stockRows();
 if(document.getElementById('prodSearch'))document.getElementById('prodSearch').oninput=e=>{searchTerm=e.target.value;document.getElementById('productRows').innerHTML=productRows()};
 if(document.getElementById('prodStation'))document.getElementById('prodStation').onchange=()=>document.getElementById('productRows').innerHTML=productRows();
}
function newOrder(){state.activeTable=null;state.cart={};state.cartNotes='';state.category='Todos';searchTerm='';go('waiter')}
function openTable(id){state.activeTable=id;let orders=tableOrders(id);if(orders.length){showModal(`<h2>Mesa ${id}</h2><p class="muted">Cuenta abierta: ${money(tableTotal(id))}</p>${orders.map(o=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>Pedido #${o.id}</b> <span class="pill">${o.status==='bill'?'Por cobrar':'En curso'}</span><div class="muted" style="margin:4px 0">${o.items.map(i=>i.qty+'× '+esc(i.name)).join(', ')}</div><b>${money(totalOrder(o))}</b></div>`).join('')}<div class="modal-actions"><button class="secondary" onclick="closeModal()">Cerrar</button><button class="secondary" onclick="addToExisting(${id})">Agregar pedido</button><button class="accent" onclick="goCashierForTable(${id})">Ir a caja</button></div>`)}else{newOrder();state.activeTable=id;render()}}
function addToExisting(id){closeModal();state.activeTable=id;state.cart={};state.cartNotes='';go('waiter')}
function goCashierForTable(id){closeModal();go('cashier')}
function setCategory(c){state.category=c;render()}
function addCart(id){let p=state.products.find(x=>x.id===id);if(!p)return;if(!state.cart[id])state.cart[id]={...p,qty:0};state.cart[id].qty++;save();render()}
function changeQty(id,d){if(!state.cart[id])return;state.cart[id].qty+=d;if(state.cart[id].qty<=0)delete state.cart[id];save();render()}
function clearCart(){state.cart={};state.cartNotes='';save();render()}
function sendOrder(){
 let tableId=Number(document.getElementById('orderTable')?.value||state.activeTable);if(!tableId){toast('Elegí una mesa antes de enviar el pedido.');return}
 let cart=Object.values(state.cart);if(!cart.length)return;
 let items=cart.map((p,idx)=>({id:'i'+Date.now()+'_'+idx,productId:p.id,name:p.name,qty:p.qty,price:p.price,station:p.station,notes:'',kitchenStatus:p.station==='kitchen'?'pending':'ready',barStatus:p.station==='bar'?'pending':'ready',ingredients:p.ingredients}));
 // Apply ingredient stock consumption, flag shortages rather than silently going negative.
 let shortages=[];
 for(let item of items){for(let ing of item.ingredients){let s=state.stock.find(x=>x.name.toLowerCase()===ing.name.toLowerCase());if(s){let need=ing.qty*item.qty;if(s.qty<need)shortages.push(`${s.name}: necesita ${need} ${s.unit}, hay ${s.qty}`);s.qty=Math.round((s.qty-need)*1000)/1000;}}}
 let o={id:state.nextOrder++,tableId,createdAt:new Date().toISOString(),status:'open',notes:state.cartNotes||'',items};state.orders.push(o);state.cart={};state.cartNotes='';state.activeTable=tableId;save();go('salon');
 toast('Pedido #'+o.id+' enviado. Cocina y barra ya pueden verlo.');
 if(shortages.length)showModal(`<h2>Pedido enviado con alertas de stock</h2><p>Estos ingredientes quedaron por debajo de lo necesario:</p><ul>${shortages.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><p class="muted">Revisá el inventario antes de continuar.</p><div class="modal-actions"><button class="accent" onclick="closeModal()">Entendido</button></div>`);
}
function markReady(orderId,itemId,station){let o=state.orders.find(x=>x.id===orderId),i=o?.items.find(x=>x.id===itemId);if(!i)return;if(station==='kitchen')i.kitchenStatus='ready';else i.barStatus='ready';if(o.items.every(x=>x.kitchenStatus==='ready'&&x.barStatus==='ready'))o.status='ready';save();render();toast('Producto marcado como listo.')}
function markBill(id){let o=state.orders.find(x=>x.id===id);if(o){o.status='bill';save();render();toast('Pedido marcado por cobrar.')}}
function payOrder(id){let o=state.orders.find(x=>x.id===id);if(!o||!state.cashOpen)return;showModal(`<h2>Cobrar pedido #${id}</h2><p class="muted">Mesa ${o.tableId} · ${o.items.map(i=>i.qty+'× '+esc(i.name)).join(', ')}</p><div class="totalrow"><span>Total a cobrar</span><span>${money(totalOrder(o))}</span></div><div class="field"><label>Medio de pago</label><select id="payMethod"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta de débito</option><option>Tarjeta de crédito</option><option>Pago combinado</option></select></div><div class="notice">Confirmar el cobro cerrará este pedido y registrará la venta.</div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="good" onclick="confirmPay(${id})">Confirmar cobro</button></div>`)}
function confirmPay(id){let o=state.orders.find(x=>x.id===id);if(!o)return;let method=document.getElementById('payMethod').value;o.status='paid';o.paidAt=new Date().toISOString();state.sessionSales.push({orderId:o.id,tableId:o.tableId,total:totalOrder(o),method,paidAt:o.paidAt,items:o.items.map(i=>({name:i.name,qty:i.qty}))});save();closeModal();render();toast('Cobro registrado. Mesa '+o.tableId+' actualizada.')}
function toggleCash(){state.cashOpen=!state.cashOpen;save();render();toast(state.cashOpen?'Caja abierta.':'Caja cerrada.')}
function stockModal(){showModal(`<h2>Agregar ingrediente al inventario</h2><div class="field"><label>Nombre</label><input id="newStockName" placeholder="Ej. Mayonesa"></div><div class="row"><div class="field"><label>Cantidad inicial</label><input id="newStockQty" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Unidad</label><select id="newStockUnit"><option>un</option><option>kg</option><option>g</option><option>l</option><option>ml</option><option>porción</option></select></div><div class="field"><label>Stock mínimo</label><input id="newStockMin" type="number" min="0" step="0.01" value="1"></div></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="accent" onclick="createStock()">Guardar ingrediente</button></div>`)}
function createStock(){let name=document.getElementById('newStockName').value.trim(),qty=Number(document.getElementById('newStockQty').value),unit=document.getElementById('newStockUnit').value,min=Number(document.getElementById('newStockMin').value);if(!name){toast('Ingresá un nombre.');return}if(state.stock.some(x=>x.name.toLowerCase()===name.toLowerCase())){toast('Ese ingrediente ya existe.');return}state.stock.push({name,qty,unit,min});save();closeModal();render();toast('Ingrediente agregado.')}
function adjustStock(name){let s=state.stock.find(x=>x.name===name);if(!s)return;showModal(`<h2>Ajustar stock</h2><p>${esc(s.name)} · Disponible: <b>${s.qty} ${esc(s.unit)}</b></p><div class="field"><label>Nuevo stock total (${esc(s.unit)})</label><input id="stockNewQty" type="number" min="0" step="0.001" value="${s.qty}"></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="accent" onclick="saveStock('${esc(name)}')">Guardar</button></div>`)}
function saveStock(name){let s=state.stock.find(x=>x.name===name),q=Number(document.getElementById('stockNewQty').value);if(s&&q>=0){s.qty=q;save();closeModal();render();toast('Stock actualizado.')} }
function productModal(p=null){let editing=!!p;showModal(`<h2>${editing?'Editar':'Nuevo'} producto</h2><div class="field"><label>Nombre</label><input id="prodName" value="${esc(p?.name||'')}" placeholder="Ej. Milanesa con papas"></div><div class="row"><div class="field"><label>Categoría</label><input id="prodCategory" value="${esc(p?.category||'Comidas')}" placeholder="Comidas"></div><div class="field"><label>Precio de venta (ARS)</label><input id="prodPrice" type="number" min="0" value="${p?.price||0}"></div></div><div class="row"><div class="field"><label>Sector de preparación</label><select id="prodStation"><option value="kitchen" ${p?.station!=='bar'?'selected':''}>Cocina</option><option value="bar" ${p?.station==='bar'?'selected':''}>Barra</option></select></div><div class="field"><label>Emoji / ícono</label><input id="prodEmoji" value="${esc(p?.emoji||'🍽️')}"></div></div><div class="field"><label>Receta: un ingrediente por línea (Ingrediente|cantidad|unidad)</label><textarea id="prodIngredients" placeholder="Pan de hamburguesa|1|un&#10;Medallón de carne|1|un">${(p?.ingredients||[]).map(i=>`${i.name}|${i.qty}|${i.unit}`).join('\n')}</textarea></div><p class="footnote">Los ingredientes deben coincidir con los nombres del inventario para descontarse automáticamente.</p><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="accent" onclick="saveProduct('${p?.id||''}')">Guardar producto</button></div>`)}
function editProduct(id){productModal(state.products.find(p=>p.id===id))}
function saveProduct(id){let name=document.getElementById('prodName').value.trim(),category=document.getElementById('prodCategory').value.trim()||'Otros',price=Number(document.getElementById('prodPrice').value),station=document.getElementById('prodStation').value,emoji=document.getElementById('prodEmoji').value.trim()||'🍽️',raw=document.getElementById('prodIngredients').value; if(!name||price<0){toast('Revisá el nombre y el precio.');return}
 let ingredients=raw.split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{let a=line.split('|').map(x=>x.trim());return {name:a[0],qty:Number(a[1]),unit:a[2]||'un'}});if(ingredients.some(x=>!x.name||!Number.isFinite(x.qty)||x.qty<0)){toast('Revisá el formato de la receta.');return}
 if(id){let p=state.products.find(p=>p.id===id);Object.assign(p,{name,category,price,station,emoji,ingredients})}else state.products.push({id:'p'+Date.now(),name,category,price,station,emoji,ingredients});save();closeModal();render();toast('Producto guardado.')}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='brasa-respaldo-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);toast('Respaldo descargado.')}
function resetDemo(){showModal(`<h2>Restablecer la demo</h2><p>Se borrarán los pedidos, ventas y cambios de stock guardados en este navegador.</p><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="danger" onclick="doReset()">Sí, restablecer</button></div>`)}
function doReset(){state=JSON.parse(JSON.stringify(initial));state.sessionStart=new Date().toISOString();save();closeModal();go('salon');toast('Demo restablecida.')}
function showModal(html){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function toast(msg){let r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>r.innerHTML='',3000)}
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}
setInterval(updateClock,15000);updateClock();render();
</script>
<script src="js/brasa-supabase.js"></script>
</body>
</html>
